name = "ezsportsnetting"
main = "worker.js"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[assets]
directory = ".."
binding = "ASSETS"
not_found_handling = "none"

[vars]
SITE_URL = "https://www.ezsportsnetting.com"
SEND_WELCOME_EMAIL = "false"
DAILY_REPORT_ENABLED = "false"

[[d1_databases]]
binding = "DB"
database_name = "ezsports-prod"
database_id = "53d1f79c-2e74-4d18-ae8d-00fab25986c6"
migrations_dir = "migrations"

[triggers]
crons = ["0 13 * * *"]
